[package]
name = "git-rig"
version = "0.6.2"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/cemcatik/git-rig"
description = "Git worktree workspace manager for multi-repo development"
homepage = "https://github.com/cemcatik/git-rig"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
colored = "3"
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
ignore = "0.4"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
